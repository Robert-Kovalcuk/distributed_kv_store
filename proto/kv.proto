syntax = "proto3";
package kv;

service KV {
  rpc Put(PutRequest) returns (PutReply);
  rpc Get(GetRequest) returns (GetReply);
  rpc Delete(DeleteRequest) returns (DeleteReply);
  rpc List(ListRequest) returns (ListReply);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutReply {}

message GetRequest {
  string key = 1;
}

message GetReply {
  bool found = 1;
  bytes value = 2; // valid only if found=true
}

message DeleteRequest {
  string key = 1;
}

message DeleteReply {
  bool removed = 1;
}

message ListRequest {
  string prefix = 1;
  uint32 limit = 2;
  string page_token = 3;
}

message KeyValue {
  string key = 1;
  bytes value = 2;
}

message ListReply {
  repeated KeyValue items = 1;
  string next_page_token = 2; // empty if no more results
}
